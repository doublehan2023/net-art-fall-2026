<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabbed Tile Quilt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="quilt" aria-label="A responsive pattern of colored tabbed tiles">
      <div class="tile white"><div class="tab green bottom"></div></div>
      <div class="tile white"><div class="tab peach right"></div></div>
      <div class="tile red"><div class="tab white-tab top"></div></div>
      <div class="tile white"><div class="tab green right"></div></div>
      <div class="tile white"><div class="tab orange right"></div></div>
      <div class="tile white"><div class="tab peach bottom"></div></div>

      <div class="tile white"><div class="tab orange left"></div></div>
      <div class="tile white"><div class="tab red top"></div></div>
      <div class="tile white"><div class="tab green top"></div></div>
      <div class="tile white"><div class="tab peach right"></div></div>
      <div class="tile orange"><div class="tab white-tab bottom"></div></div>
      <div class="tile white"><div class="tab green bottom"></div></div>

      <div class="tile peach"><div class="tab white-tab bottom"></div></div>
      <div class="tile white"><div class="tab peach bottom"></div></div>
      <div class="tile white"><div class="tab red bottom"></div></div>
      <div class="tile red"><div class="tab white-tab right"></div></div>
      <div class="tile white"><div class="tab green bottom"></div></div>
      <div class="tile white"><div class="tab red right"></div></div>

      <div class="tile white"><div class="tab orange top"></div></div>
      <div class="tile orange"><div class="tab white-tab right"></div></div>
      <div class="tile white"><div class="tab green right"></div></div>
      <div class="tile white"><div class="tab red top"></div></div>
      <div class="tile peach"><div class="tab white-tab top"></div></div>
      <div class="tile white"><div class="tab peach left"></div></div>
    </main>
  </body>
</html>
